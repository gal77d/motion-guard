<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Motion Guard - Phone Camera</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 20px; margin-bottom: 10px; }
        p { color: #b0b0b0; font-size: 14px; margin-bottom: 20px; }
        
        #startBtn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #startBtn:active {
            background-color: #45a049;
        }
        
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #ff9800;
        }

        /* Hidden video element used to process frames */
        video {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Motion Guard Active</h1>
        <p id="instruction">Place your phone facing the area you want to monitor, then press Start.</p>
        
        <button id="startBtn">START</button>
        <div id="status"></div>

        <!-- Camera stream -->
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- Socket.IO library -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Extract session ID from URL (e.g., phone.html?session=12345)
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');

        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const instruction = document.getElementById('instruction');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let previousFrameData = null;
        let isMonitoring = false;

        startBtn.addEventListener('click', async () => {
            if (!sessionId) {
                alert("Error: Invalid or missing Session ID!");
                return;
            }

            startBtn.style.display = 'none';
            instruction.innerText = "Get ready...";
            
            // 3 Seconds Delay countdown
            let countdown = 3;
            statusDiv.innerText = `Starting in ${countdown}...`;

            let timer = setInterval(async () => {
                countdown--;
                if (countdown > 0) {
                    statusDiv.innerText = `Starting in ${countdown}...`;
                } else {
                    clearInterval(timer);
                    statusDiv.innerText = "Camera is active! Monitoring for motion...";
                    
                    // Access phone camera
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                        video.srcObject = stream;
                        await video.play();
                        
                        // Start motion detection loop
                        isMonitoring = true;
                        detectMotion();
                    } catch (err) {
                        statusDiv.innerText = "Error: Camera access denied!";
                        console.error(err);
                    }
                }
            }, 1000);
        });

        function detectMotion() {
            if (!isMonitoring) return;

            canvas.width = 100; // Low resolution for fast processing
            canvas.height = 100;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            if (previousFrameData) {
                let diff = 0;
                // Compare pixels between current and previous frame
                for (let i = 0; i < currentFrame.data.length; i += 4) {
                    let rDiff = Math.abs(currentFrame.data[i] - previousFrameData.data[i]);
                    let gDiff = Math.abs(currentFrame.data[i+1] - previousFrameData.data[i+1]);
                    let bDiff = Math.abs(currentFrame.data[i+2] - previousFrameData.data[i+2]);
                    
                    if ((rDiff + gDiff + bDiff) / 3 > 50) { // Motion threshold
                        diff++;
                    }
                }

                // If enough pixels changed, motion is detected!
                if (diff > 300) { // Sensitivity limit
                    statusDiv.innerText = "Motion detected! Triggering action...";
                    isMonitoring = false;
                    
                    // Tell the server to trigger action on PC
                    socket.emit('motion_detected', { sessionId });
                    return;
                }
            }

            previousFrameData = currentFrame;
            setTimeout(() => requestAnimationFrame(detectMotion), 200); // Check every 200ms
        }
    </script>

</body>
</html>
